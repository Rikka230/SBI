    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(0, 132, 255, 0.18), transparent 30%),
                        radial-gradient(circle at 80% 10%, rgba(111, 0, 255, 0.16), transparent 34%),
                        #050313;
            color: #ffffff;
        }
        .sbi-error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 120px 24px 80px;
            text-align: center;
        }
        .sbi-error-card {
            width: min(760px, 100%);
            padding: clamp(32px, 7vw, 72px);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 34px;
            background: linear-gradient(145deg, rgba(9, 13, 36, 0.86), rgba(5, 3, 19, 0.92));
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }
        .sbi-error-code {
            margin: 0 0 12px;
            font-size: clamp(68px, 16vw, 160px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.08em;
            color: #35a7ff;
            text-shadow: 0 0 38px rgba(53, 167, 255, 0.48);
        }
        .sbi-error-title {
            margin: 0;
            font-size: clamp(28px, 5vw, 56px);
            line-height: 1;
            text-transform: uppercase;
            font-weight: 900;
        }
        .sbi-error-text {
            max-width: 560px;
            margin: 22px auto 0;
            color: rgba(255,255,255,0.76);
            font-size: 1.05rem;
            line-height: 1.7;
        }
        .sbi-error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 34px;
        }
        .sbi-error-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 22px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            background: rgba(255,255,255,0.06);
        }
        .sbi-error-link-primary {
            border-color: rgba(53, 167, 255, 0.62);
            background: linear-gradient(135deg, rgba(53, 167, 255, 0.95), rgba(111, 0, 255, 0.82));
            box-shadow: 0 16px 42px rgba(53, 167, 255, 0.24);
        }
    </style>
</head>
<body data-sbi-public-page="404">
    <main class="sbi-error-page" aria-labelledby="sbi-error-title">
        <section class="sbi-error-card">
            <p class="sbi-error-code text-italic" aria-hidden="true">404</p>
            <h1 id="sbi-error-title" class="sbi-error-title text-italic">Page introuvable.</h1>
            <p class="sbi-error-text text-italic">
                Cette page n’existe plus, a été déplacée ou appartient à l’ancien site. Le bon vestiaire est juste à côté.
            </p>
            <div class="sbi-error-actions">
                <a class="sbi-error-link sbi-error-link-primary text-italic" href="/">Retour à l’accueil</a>
                <a class="sbi-error-link text-italic" href="/formations.html">Voir les formations</a>
                <a class="sbi-error-link text-italic" href="/contact.html">Contacter SBI</a>
            </div>
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Console - Lives V1 secours</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css?v=8.0P.167.213">
  <link rel="stylesheet" href="/admin/css/admin-surface-unified.css?v=8.0P.167.213">
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.213">
  <link rel="modulepreload" href="/js/sbi-version.js">
  <link rel="stylesheet" href="css/admin-responsive.css">
  <link rel="stylesheet" href="css/sbi-bottom-nav.css" data-sbi-bottom-nav="1">
  <script src="/admin/js/components.js"></script>
</head>
<body class="preload sbi-admin-surface sbi-live-page" data-live-role="admin">
  <div class="app-container" id="app-container">
    <admin-left-panel></admin-left-panel>
    <header class="top-bar">
      <button class="mobile-toggle left-toggle" id="btn-toggle-mobile"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <span class="page-title">Lives</span>
      <button class="mobile-toggle right-toggle" id="btn-toggle-right"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
    </header>
    <admin-right-panel></admin-right-panel>

    <main id="main-content">
      <div class="content-wrapper" data-sbi-live-scheduler>
        <section class="sbi-live-hero">
          <div>
            <span class="sbi-live-kicker">Admin</span>
            <h1>Suivi des lives</h1>
          </div>
          <span id="sbi-live-status" class="sbi-live-status"></span>
        </section>

        <div class="sbi-live-grid">
          <aside class="sbi-live-panel">
            <div class="sbi-live-panel__head">
              <strong>Promotions</strong>
              <span>Toutes les promotions actives et leurs blocs live.</span>
            </div>
            <div id="sbi-live-promotions" class="sbi-live-list"></div>
          </aside>

          <section class="sbi-live-workspace">
            <div class="sbi-live-panel">
              <div class="sbi-live-panel__head">
                <strong>Calendrier promotion</strong>
                <span>Dates validees et plages a planifier.</span>
              </div>
              <div id="sbi-live-calendar" class="sbi-live-calendar"></div>
              <div id="sbi-live-items" class="sbi-live-list"></div>
            </div>
            <aside id="sbi-live-detail" class="sbi-live-panel"></aside>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/admin-ui.js?v=8.0P.167.213"></script>
  <script type="module" src="/admin/js/admin-notifications.js?v=8.0P.167.213"></script>
  <script type="module" src="/js/live/live-scheduler-page.js?v=8.0P.167.213"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal admin - SBI Console</title>
    <link rel="stylesheet" href="css/admin-layout.css">
    <link rel="stylesheet" href="css/admin.css?v=8.0P.167.51">
    <link rel="stylesheet" href="css/admin-notifications.css">
    <link rel="stylesheet" href="css/admin-global-audit-log.css?v=8.0P.167.42">

    <script src="js/components.js?v=8.0P.167.62"></script>
    <link rel="stylesheet" href="css/admin-surface-unified.css?v=8.0P.167.52">
</head>
<body class="preload sbi-admin-surface">

<div class="app-container" id="app-container">

    <script>
        if (window.innerWidth > 1024) {
            const app = document.getElementById('app-container');
            if (localStorage.getItem('leftPanelCollapsed') === 'true') app.classList.add('left-collapsed');
            if (localStorage.getItem('rightPanelCollapsed') === 'true') app.classList.add('right-collapsed');
        }
    </script>

    <admin-left-panel></admin-left-panel>

    <header class="top-bar">
        <button class="mobile-toggle left-toggle" id="btn-toggle-mobile"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <span class="page-title" style="font-weight: 600;">
            Journal admin
        </span>
        <button class="mobile-toggle right-toggle" id="btn-toggle-right" style="position: relative;">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="notif-badge" id="avatar-badge" style="display:none; top: 0; right: 0;">0</span>
        </button>
    </header>

    <main id="main-content">
        <div class="content-wrapper">
            <section id="view-audit-log" class="admin-view active sbi-audit-standalone-shell">
                <div class="sbi-audit-view">
                    <div class="sbi-audit-header">
                        <div>
                            <h2>Journal admin</h2>
                            <p>Vue globale des actions sensibles : comptes, relances, emails, connexions et traitements manuels.</p>
                        </div>
                        <button type="button" id="audit-refresh-btn" class="sbi-audit-refresh-btn">Rafraîchir</button>
                    </div>

                    <div class="sbi-audit-toolbar">
                        <input type="search" id="audit-search" placeholder="Rechercher un compte, un email, un admin...">
                        <select id="audit-type-filter">
                            <option value="all">Toutes les actions</option>
                            <option value="account.created">Comptes créés</option>
                            <option value="account.password_reset_sent">Reset mot de passe</option>
                            <option value="account.finalization_invite_sent">Invitations finalisation</option>
                            <option value="account.finalization_reminder_sent">Relances automatiques</option>
                            <option value="account.finalization_escalation_required">Contacts directs requis</option>
                            <option value="account.finalization_escalation_resolved">Contacts traités</option>
                            <option value="account.email_bounced">Emails rejetés Brevo</option>
                            <option value="account.finalization_reminder_skipped">Emails invalides</option>
                            <option value="account.email_changed">Emails modifiés</option>
                            <option value="account.promotion_updated">Promotions élèves</option>
                            <option value="account.login_tracked">Connexions détectées</option>
                            <option value="account.deleted">Comptes supprimés</option>
                        </select>
                    </div>

                    <div class="sbi-audit-stats" id="audit-stats"></div>
                    <div class="sbi-audit-list" id="audit-log-list">
                        <div class="sbi-audit-empty">Chargement du journal admin...</div>
                    </div>
                    <div class="sbi-audit-footer">
                        <span id="audit-log-count">0 entrée chargée</span>
                        <button type="button" id="audit-load-more-btn" class="sbi-audit-load-more-btn">Charger plus</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <admin-right-panel></admin-right-panel>

</div>

<script type="module" src="js/admin-ui.js?v=8.0P.167.62"></script>
<script type="module" src="js/tracker.js?v=8.0P.167.44"></script>
<script type="module" src="js/admin-notifications.js"></script>
<script type="module" src="js/admin-global-audit-log.js?v=8.0P.167.58"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.remove('preload');
        document.body.classList.add('sbi-preload-timeout');
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livret d'apprentissage - SBI Console</title>
    <link rel="stylesheet" href="css/admin-layout.css">
    <link rel="stylesheet" href="css/admin.css?v=8.0P.167.51">
    <link rel="stylesheet" href="css/admin-notifications.css">
    <link rel="stylesheet" href="css/admin-surface-unified.css?v=8.0P.167.52">
    <link rel="stylesheet" href="/css/booklet.css?v=8.0P.167.304">
    <link rel="modulepreload" href="/js/sbi-version.js">
    <link rel="stylesheet" href="css/admin-responsive.css">
    <link rel="stylesheet" href="css/sbi-bottom-nav.css" data-sbi-bottom-nav="1">
    <script src="js/components.js"></script>
</head>
<body class="preload sbi-admin-surface">

<div class="app-container" id="app-container">
    <script>
        if (window.innerWidth > 1024) {
            const app = document.getElementById('app-container');
            if (localStorage.getItem('leftPanelCollapsed') === 'true') app.classList.add('left-collapsed');
            if (localStorage.getItem('rightPanelCollapsed') === 'true') app.classList.add('right-collapsed');
        }
    </script>

    <admin-left-panel></admin-left-panel>

    <header class="top-bar">
        <button class="mobile-toggle left-toggle" id="btn-toggle-mobile"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <span class="page-title" style="font-weight: 600;">Livret d'apprentissage</span>
        <button class="mobile-toggle right-toggle" id="btn-toggle-right" style="position: relative;">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="notif-badge" id="avatar-badge" style="display:none; top: 0; right: 0;">0</span>
        </button>
    </header>

    <main id="main-content">
        <div class="content-wrapper">
            <section id="view-booklets" class="admin-view active" aria-label="Livret d'apprentissage">
                <div id="booklet-root" class="sbi-booklet-page">
                    <div class="sbi-booklet-status">Chargement…</div>
                </div>
            </section>
        </div>
    </main>

    <admin-right-panel></admin-right-panel>
</div>

<script type="module" src="js/admin-ui.js?v=8.0P.167.372"></script>
<script type="module" src="js/tracker.js?v=8.0P.167.378"></script>
<script type="module" src="js/admin-notifications.js?v=8.0P.167.205"></script>
<script type="module" src="js/apprenticeship-booklets.js?v=8.0P.167.375"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.remove('preload');
        document.body.classList.add('sbi-preload-timeout');
    });
</script>
</body>
</html>

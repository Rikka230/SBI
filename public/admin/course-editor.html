<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de cours V2 - SBI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css?v=8.0P.167.51">
  <link rel="stylesheet" href="/admin/css/admin-notifications.css">
  <link rel="stylesheet" href="/admin/css/admin-surface-unified.css?v=8.0P.167.52">
  <link rel="stylesheet" href="/css/course-editor-v2.css?v=8.0P.167.162">

  <style id="sbi-course-editor-v2-hard-unblank">
    html, body { min-height: 100vh !important; opacity: 1 !important; visibility: visible !important; }
    body.sbi-editor-v2 { overflow-y: auto !important; }
    body.sbi-editor-v2 #app-container,
    body.sbi-editor-v2 #main-content,
    body.sbi-editor-v2 .content-wrapper,
    body.sbi-editor-v2 #sbi-course-editor-v2 {
      opacity: 1 !important;
      visibility: visible !important;
    }
    body.sbi-editor-v2 #main-content { display: block !important; min-height: 100vh !important; }
    body.sbi-editor-v2 .content-wrapper { display: block !important; min-height: 60vh !important; }
    body.sbi-editor-v2 #sbi-course-editor-v2 { display: block !important; min-height: 280px !important; }
    body.sbi-editor-v2 #sbi-course-editor-v2:empty::before {
      content: "Chargement de l’éditeur V2…";
      display: block;
      margin: 1rem;
      padding: 1rem;
      border: 1px solid #d9e1ec;
      border-radius: 16px;
      background: #fff;
      color: #0f172a;
      font-weight: 800;
    }
  </style>
  <script src="/admin/js/components.js?v=8.0P.167.64"></script>
</head>
<body class="sbi-editor-v2 sbi-editor-v2--admin sbi-editor-v2--embedded sbi-admin-surface no-right-panel" data-editor-role="admin">
  <div class="app-container" id="app-container">
    <admin-left-panel></admin-left-panel>
    <header class="top-bar">
      <button class="mobile-toggle left-toggle" id="btn-toggle-mobile"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <span class="page-title" style="font-weight: 600;">SBI Admin</span>
      <button class="mobile-toggle right-toggle" id="btn-toggle-right" style="position: relative;">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span class="notif-badge" id="avatar-badge" style="display:none; top: 0; right: 0;">0</span>
      </button>
    </header>
    <main id="main-content">
      <div class="content-wrapper sbi-course-editor-content-wrapper">
        <div id="sbi-course-editor-v2" data-editor-role="admin"><div class="sbi-editor-v2-fallback"><strong>Chargement de l’éditeur V2…</strong><span>Si cette zone reste visible, ouvre la console et recharge sans cache.</span></div></div>
      </div>
    </main>
  </div>
  <script type="module" src="/js/course-editor-v2/course-editor-v2.js?v=8.0P.167.162"></script>
</body>
</html>

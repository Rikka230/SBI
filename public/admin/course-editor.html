<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éditeur de cours V2 - SBI Admin</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css?v=8.0P.167.51">
  <link rel="stylesheet" href="/admin/css/admin-notifications.css">
  <link rel="stylesheet" href="/admin/css/admin-surface-unified.css?v=8.0P.167.52">
  <link rel="stylesheet" href="/css/course-editor-v2.css?v=8.0P.167.203">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="/admin/js/components.js?v=8.0P.167.64"></script>
  <style>
    body.sbi-editor-v2--embedded #main-content,
    body.sbi-editor-v2--embedded .content-wrapper,
    body.sbi-editor-v2--embedded #sbi-course-editor-v2 {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body class="preload sbi-editor-v2 sbi-editor-v2--admin sbi-editor-v2--embedded sbi-admin-surface" data-editor-role="admin">
  <div class="app-container" id="app-container">
    <admin-left-panel></admin-left-panel>
    <header class="top-bar">
      <button class="mobile-toggle left-toggle" id="btn-toggle-mobile"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <span class="page-title" style="font-weight: 600;">SBI Admin</span>
      <button class="mobile-toggle right-toggle" id="btn-toggle-right" style="position: relative;">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span class="notif-badge" id="avatar-badge" style="display:none; top: 0; right: 0;">0</span>
      </button>
    </header>
    <main id="main-content">
      <div class="content-wrapper sbi-course-editor-content-wrapper">
        <div id="sbi-course-editor-v2" data-editor-role="admin">
          <div class="sbi-editor-v2-fallback">
            <strong>Chargement de l’éditeur V2…</strong>
            <span>Si cette zone reste visible, recharge sans cache puis vérifie la console.</span>
          </div>
        </div>
      </div>
    </main>
    <admin-right-panel></admin-right-panel>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.body?.classList?.remove('preload');
      document.documentElement?.classList?.add('sbi-admin-loader-released');
      const app = document.getElementById('app-container');
      if (app && window.innerWidth > 1024) {
        if (localStorage.getItem('leftPanelCollapsed') === 'true') app.classList.add('left-collapsed');
        if (localStorage.getItem('rightPanelCollapsed') === 'true') app.classList.add('right-collapsed');
      }
    });
  </script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module" src="/admin/js/admin-ui.js?v=8.0P.167.205"></script>
  <script type="module" src="/admin/js/admin-notifications.js?v=8.0P.167.205"></script>
  <script type="module" src="/admin/js/tracker.js?v=8.0P.167.314"></script>
  <script type="module" src="/js/course-editor-v2/course-editor-v2.js?v=8.0P.167.205"></script>
</body>
</html>

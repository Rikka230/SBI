<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Prof - Lives</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css?v=8.0P.167.247">
  <link rel="stylesheet" href="/teacher/css/teacher.css?v=8.0P.167.247">
  <link rel="stylesheet" href="/css/live-scheduler-v2.css?v=8.0P.167.247">
  <script src="/admin/js/components.js?v=8.0P.167.247"></script>


  <style id="sbi-live-v2-hard-reveal-style">
    body.sbi-live-v2-page #app-container,
    body.sbi-live-v2-page #main-content,
    body.sbi-live-v2-page #main-content > .content-wrapper,
    body.sbi-live-v2-page [data-sbi-live-v2] {
      display: block !important;
      opacity: 1 !important;
      visibility: visible !important;
      transform: none !important;
      pointer-events: auto !important;
      filter: none !important;
    }

    body.sbi-live-v2-page .sbi-assistant:not(.has-notifications) .sbi-assistant__badge,
    body.sbi-live-v2-page .sbi-assistant__badge:empty,
    body.sbi-live-v2-page .sbi-assistant__badge[hidden] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    body.sbi-live-v2-page.sbi-navigating-out #main-content,
    body.sbi-live-v2-page.sbi-navigating-out .content-wrapper,
    body.sbi-live-v2-page.sbi-navigating-out [data-sbi-live-v2] {
      opacity: 1 !important;
      transform: none !important;
      pointer-events: auto !important;
      filter: none !important;
    }
  </style>

  <script id="sbi-live-v2-direct-reveal">
    (function () {
      function revealLiveV2() {
        try { document.documentElement.classList.remove('preload'); } catch (_) {}
        try { document.body && document.body.classList.remove('preload'); } catch (_) {}
        var main = document.getElementById('main-content');
        if (main) { main.hidden = false; main.style.display = 'block'; main.style.visibility = 'visible'; main.style.opacity = '1'; main.style.transform = 'none'; }
        var root = document.querySelector('[data-sbi-live-v2]');
        if (root) { root.hidden = false; root.style.display = 'block'; root.style.visibility = 'visible'; root.style.opacity = '1'; root.style.transform = 'none'; }
      }
      revealLiveV2();
      document.addEventListener('DOMContentLoaded', revealLiveV2, { once: true });
      window.addEventListener('pageshow', revealLiveV2);
      setTimeout(revealLiveV2, 300);
      setTimeout(revealLiveV2, 1200);
    }());
  </script>
</head>
<body class="sbi-internal-ui sbi-teacher-surface sbi-live-v2-page" data-live-v2-role="teacher">
  <div class="app-container" id="app-container">
    <teacher-left-panel></teacher-left-panel>
    <teacher-top-bar></teacher-top-bar>

    <main id="main-content">
      <div class="content-wrapper sbi-live-v2" data-sbi-live-v2>
        <section class="sbi-live-v2-hero">
          <div>
            <span class="sbi-live-v2-kicker">Professeur</span>
            <h1>Gestion des lives</h1>
            <p>Planifiez les lives de vos promotions à partir du cursus validé, puis ouvrez la salle ou notifiez le démarrage.</p>
          </div>
          <span id="sbi-live-v2-status" class="sbi-live-v2-status">Initialisation…</span>
        </section>

        <section id="sbi-live-v2-summary" class="sbi-live-v2-summary" aria-label="Résumé lives"></section>

        <section class="sbi-live-v2-layout">
          <aside class="sbi-live-v2-card sbi-live-v2-promotions-card">
            <div class="sbi-live-v2-card-head">
              <strong>Promotions</strong>
              <span>Promotions rattachées à vos formations.</span>
            </div>
            <div id="sbi-live-v2-promotions" class="sbi-live-v2-list"></div>
          </aside>

          <section class="sbi-live-v2-card sbi-live-v2-cursus-card">
            <div class="sbi-live-v2-card-head sbi-live-v2-card-head-row">
              <div>
                <strong>Lives du cursus</strong>
                <span>Titres lus depuis le cursus, dates issues de la promotion.</span>
              </div>
              <button id="sbi-live-v2-refresh" class="sbi-live-v2-small-btn" type="button">Rafraîchir</button>
            </div>
            <div id="sbi-live-v2-lives" class="sbi-live-v2-live-list"></div>
          </section>

          <aside class="sbi-live-v2-card sbi-live-v2-detail-card">
            <div id="sbi-live-v2-detail"></div>
          </aside>
        </section>
      </div>
    </main>
  </div>

  <script type="module" id="sbi-live-v2-standalone-boot">
    import { waitForSbiComponents } from '/admin/js/components/ready.js';
    import { initPanelControls } from '/admin/js/admin-ui/panels.js';
    import { initSpaceTheme } from '/admin/js/admin-ui/theme.js?v=8.0P.167.52';
    import { initSbiAppShell } from '/js/app-shell/app-shell.js?v=8.0P.167.360';
    import { initSbiVersionBadge } from '/js/sbi-version-badge.js?v=8.0P.167.372';
    import { initAssistantPrototype } from '/admin/js/admin-ui/assistant.js?v=8.0P.167.247';

    let standaloneNavBound = false;
    let standaloneClickHandler = null;
    let standaloneKeydownHandler = null;

    function unbindStandaloneNavigation() {
      if (!standaloneNavBound) return;
      if (standaloneClickHandler) document.removeEventListener('click', standaloneClickHandler, true);
      if (standaloneKeydownHandler) document.removeEventListener('keydown', standaloneKeydownHandler, true);
      standaloneClickHandler = null;
      standaloneKeydownHandler = null;
      standaloneNavBound = false;
    }

    function revealLiveV2() {
      document.documentElement?.classList?.remove('preload');
      document.documentElement?.classList?.remove('sbi-page-transitions-ready');
      document.body?.classList?.remove('preload');
      document.body?.classList?.remove('sbi-navigating-out');
      document.body?.removeAttribute('aria-busy');
      document.body?.classList?.add('sbi-internal-ui', 'sbi-live-v2-standalone-ready');
      const app = document.getElementById('app-container');
      const main = document.getElementById('main-content');
      const root = document.querySelector('[data-sbi-live-v2]');
      [app, main, root].forEach((node) => {
        if (!node) return;
        node.hidden = false;
        node.style.pointerEvents = 'auto';
        node.style.display = node === main || node === root ? 'block' : '';
        node.style.visibility = 'visible';
        node.style.opacity = '1';
        node.style.transform = 'none';
      });
    }

    function normalizeStandaloneUrl(rawHref) {
      if (!rawHref || /^#|javascript:|mailto:|tel:/i.test(rawHref)) return null;
      try { return new URL(rawHref, window.location.href); } catch (_) { return null; }
    }

    function navigateFromStandalone(url, source = 'teacher-lives-standalone') {
      if (!url || url.origin !== window.location.origin) return false;
      if (url.pathname === window.location.pathname && url.search === window.location.search && !url.hash) return true;
      const shell = window.SBI_APP_SHELL;
      if (shell?.enabled && typeof shell.canHandle === 'function' && shell.canHandle(url) && typeof shell.navigate === 'function') {
        shell.navigate(url, { historyMode: 'push', source });
        // Le shell PJAX prend le relais : ses propres listeners (router.attach)
        // gèrent désormais les clics/clavier. On retire les listeners capture
        // standalone pour éviter qu'ils persistent et doublent la navigation.
        unbindStandaloneNavigation();
        return true;
      }
      window.location.assign(url.href);
      return true;
    }

    function bindStandaloneNavigation() {
      if (standaloneNavBound) return;
      standaloneNavBound = true;

      standaloneClickHandler = (event) => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        const trigger = event.target?.closest?.('[data-sbi-href], [data-href], a[href]');
        if (!trigger) return;
        if (!trigger.closest('#left-panel, .top-bar')) return;
        if (trigger.matches?.('a[target]') && trigger.getAttribute('target') !== '_self') return;

        const rawHref = trigger.getAttribute('data-sbi-href') || trigger.getAttribute('data-href') || trigger.getAttribute('href');
        const url = normalizeStandaloneUrl(rawHref);
        if (!url || url.origin !== window.location.origin) return;

        event.preventDefault();
        event.stopPropagation();
        revealLiveV2();

        navigateFromStandalone(url, 'teacher-lives-standalone-click');
      };
      document.addEventListener('click', standaloneClickHandler, true);

      standaloneKeydownHandler = (event) => {
        if (event.defaultPrevented || (event.key !== 'Enter' && event.key !== ' ')) return;
        const trigger = event.target?.closest?.('[data-sbi-href], [data-href]');
        if (!trigger) return;
        if (!trigger.closest('#left-panel, .top-bar')) return;
        const rawHref = trigger.getAttribute('data-sbi-href') || trigger.getAttribute('data-href');
        const url = normalizeStandaloneUrl(rawHref);
        if (!url || url.origin !== window.location.origin) return;
        event.preventDefault();
        revealLiveV2();
        navigateFromStandalone(url, 'teacher-lives-standalone-click');
      };
      document.addEventListener('keydown', standaloneKeydownHandler, true);
    }

    async function bootStandaloneLiveV2() {
      revealLiveV2();
      try { await waitForSbiComponents(900); } catch (_) {}
      try { initSpaceTheme(); } catch (error) { console.warn('[SBI Lives V2] theme standalone indisponible', error); }
      try { initSbiAppShell(); } catch (error) { console.warn('[SBI Lives V2] app-shell standalone indisponible', error); }
      bindStandaloneNavigation();
      try { initPanelControls(); } catch (error) { console.warn('[SBI Lives V2] panels standalone indisponibles', error); }
      try { initSbiVersionBadge(); } catch (error) { console.warn('[SBI Lives V2] badge standalone indisponible', error); }
      try { initAssistantPrototype(); } catch (error) { console.warn('[SBI Lives V2] assistant standalone indisponible', error); }
      revealLiveV2();
    }

    window.addEventListener('pageshow', revealLiveV2);
    window.addEventListener('focus', revealLiveV2);
    window.setTimeout(revealLiveV2, 120);
    window.setTimeout(revealLiveV2, 700);
    window.setTimeout(revealLiveV2, 1600);
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootStandaloneLiveV2, { once: true });
    else bootStandaloneLiveV2();
  </script>

  <script type="module" src="/admin/js/admin-notifications.js?v=8.0P.167.247"></script>
  <script type="module" src="/js/live/live-scheduler-v2-page.js?v=8.0P.167.357"></script>
</body>
</html>

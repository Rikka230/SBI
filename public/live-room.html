<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI - Salle de conférence</title>
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.218">
  <style>
    html, body.sbi-live-room-page, .sbi-live-room-shell, .sbi-live-room-stage { opacity: 1 !important; visibility: visible !important; }
  </style>
  <script>
    (function () {
      function revealLiveRoom() {
        document.documentElement.classList.remove('preload');
        if (document.body) document.body.classList.remove('preload');
        var shell = document.querySelector('.sbi-live-room-shell');
        var frame = document.getElementById('sbi-live-room-frame');
        if (shell) { shell.hidden = false; shell.style.visibility = 'visible'; shell.style.opacity = '1'; }
        if (frame) { frame.hidden = false; frame.style.visibility = 'visible'; frame.style.opacity = '1'; }
      }
      revealLiveRoom();
      document.addEventListener('DOMContentLoaded', revealLiveRoom, { once: true });
      window.addEventListener('pageshow', revealLiveRoom);
      setTimeout(revealLiveRoom, 250);
      setTimeout(revealLiveRoom, 900);
    }());
  </script>
</head>
<body class="sbi-live-room-page">
  <main class="sbi-live-room-shell">
    <header class="sbi-live-room-header">
      <div>
        <span class="sbi-live-kicker">Salle de conférence</span>
        <h1 id="sbi-live-room-title">Salle SBI</h1>
        <p id="sbi-live-room-subtitle">Connexion sécurisée</p>
      </div>
      <div class="sbi-live-room-header__right">
        <div class="sbi-live-room-header__topline">
          <span id="sbi-live-room-badge" class="sbi-live-room-badge">Live</span>
          <span id="sbi-live-room-status" class="sbi-live-status">Initialisation...</span>
        </div>
        <div id="sbi-live-room-actions" class="sbi-live-room-actions" hidden>
          <button type="button" id="sbi-live-record-start" class="sbi-live-room-action">Enregistrer</button>
          <button type="button" id="sbi-live-record-stop" class="sbi-live-room-action" hidden>Stop replay</button>
          <button type="button" id="sbi-live-end-session" class="sbi-live-room-action sbi-live-room-action--danger">Terminer le live</button>
        </div>
      </div>
    </header>

    <section class="sbi-live-room-stage">
      <div id="sbi-live-room-frame" class="sbi-live-room-frame">
        <div class="sbi-live-room-loading">Préparation de la salle...</div>
      </div>
      <aside class="sbi-live-room-docs" id="sbi-live-room-docs" aria-label="Documents partagés">
        <div class="sbi-live-room-docs__head">
          <strong>Documents</strong>
          <span id="sbi-live-files-status">Aucun fichier partagé</span>
        </div>
        <div id="sbi-live-file-upload-zone" class="sbi-live-room-upload" hidden>
          <input id="sbi-live-file-input" type="file" multiple>
          <button type="button" id="sbi-live-file-upload" class="sbi-live-room-action">Partager</button>
        </div>
        <div id="sbi-live-files-list" class="sbi-live-room-files"></div>
      </aside>
      <div id="sbi-live-watermark" class="sbi-live-watermark">SBI</div>
    </section>
  </main>

  <script type="module" src="/js/live/live-room-page.js?v=8.0P.167.218"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SBI - Connexion</title>

    <link rel="stylesheet" href="css/style.css?v=8.0P.125">
    <link rel="stylesheet" href="css/sbi-signals.css?v=8.0P.125">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;0,900;1,400;1,600;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        /* =========================
           LOGIN PAGE
           ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 5% 0 5%;
            position: relative;
            z-index: 2;
        }

        .login-card {
            --login-corner-band: #000000;
            --login-corner-separator: rgba(255, 255, 255, 0.15);
            --login-corner-border: var(--border-color);

            width: 100%;
            max-width: 450px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 3.5rem 3rem 2.55rem;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: visible;
            transition:
                border-color 0.28s ease,
                box-shadow 0.28s ease,
                transform 0.28s ease;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border: 1px solid transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.28s ease;
        }

        .login-card.is-loading {
            --login-corner-band: rgba(0, 81, 255, 0.34);
            --login-corner-separator: rgba(255, 255, 255, 0.12);
            --login-corner-border: rgba(0, 81, 255, 0.42);

            border-color: rgba(0, 81, 255, 0.42);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 22px rgba(0, 81, 255, 0.08);
        }

        .login-card.is-success {
            --login-corner-band: var(--sbi-blue);
            --login-corner-separator: rgba(255, 255, 255, 0.18);
            --login-corner-border: rgba(0, 81, 255, 0.65);

            border-color: rgba(0, 81, 255, 0.88);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 26px rgba(0, 81, 255, 0.18);
        }

        .login-card.is-success::before {
            opacity: 1;
            border-color: rgba(0, 81, 255, 0.42);
            animation: loginSuccessFlash 0.62s ease-out;
        }

        .login-card.is-error {
            --login-corner-band: #ff4a4a;
            --login-corner-separator: rgba(255, 255, 255, 0.16);
            --login-corner-border: rgba(255, 74, 74, 0.55);

            border-color: rgba(255, 74, 74, 0.72);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 74, 74, 0.10);
            animation: loginErrorShake 0.34s ease;
        }

        .login-card.is-error::before {
            opacity: 1;
            border-color: rgba(255, 74, 74, 0.32);
        }

        /* Coin bas droit : même logique que les cartes parcours, sans overlay lumineux carré */
        .login-card-cut {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 60px;
            height: 60px;
            background: linear-gradient(
                -45deg,
                #040508 0%,
                #040508 18px,
                var(--login-corner-band) 18px,
                var(--login-corner-band) 36px,
                var(--login-corner-separator) 36px,
                var(--login-corner-separator) 37px,
                transparent 37px
            );
            pointer-events: none;
            z-index: 2;
            border-right: 1px solid var(--login-corner-border);
            border-bottom: 1px solid var(--login-corner-border);
            transition:
                background 0.24s ease,
                border-color 0.24s ease,
                filter 0.24s ease;
        }

        .login-card-cut::before,
        .login-card-cut::after {
            content: none;
            display: none;
        }

        .login-card.is-loading .login-card-cut {
            animation: loginCornerPulse 0.9s ease-in-out infinite alternate;
        }

        .login-card.is-success .login-card-cut,
        .login-card.is-error .login-card-cut {
            animation: none;
        }

        .login-title {
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            letter-spacing: -1px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .login-field {
            margin-bottom: 1.5rem;
            text-align: left;
            position: relative;
            z-index: 2;
        }

        .login-field-password {
            margin-bottom: 2.5rem;
        }

        .login-field label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .login-input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: white;
            font-size: 1rem;
            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        .login-input:focus {
            border-color: var(--sbi-blue) !important;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 81, 255, 0.08);
        }

        .login-card.is-error .login-input {
            border-color: rgba(255, 74, 74, 0.58);
        }

        .login-submit {
            width: 100%;
            justify-content: center;
            padding: 1rem;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        .login-submit[disabled] {
            cursor: wait;
            opacity: 0.82;
            transform: none;
        }

        .login-submit-arrow {
            margin-left: 8px;
        }

        /* Zone réservée : la carte ne change plus de taille */
        #error-message {
            min-height: 1.25rem;
            margin-top: 1.15rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.25;
            color: #ff4a4a;
            opacity: 0;
            visibility: hidden;
            position: relative;
            z-index: 2;
            transition:
                opacity 0.22s ease,
                visibility 0.22s ease;
        }

        #error-message.is-visible {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           SIGNAL LOGIN
           Petit losange : rejoindre SBI
           ========================= */

        .sbi-signal-login {
            --signal-size: 30px;
            --signal-bubble-lift: -14px;
            --signal-pointer-y: 74%;

            top: 2.15rem;
            right: -17px;
            flex-direction: row-reverse;
        }

        .sbi-signal-login::before {
            left: auto;
            right: calc(var(--signal-size) * 0.5);
            background: linear-gradient(
                270deg,
                rgba(0, 81, 255, 0.62),
                rgba(0, 81, 255, 0.22),
                transparent
            );
        }

        .sbi-signal-login::after {
            left: auto;
            right: calc(var(--signal-size) + 0.52rem);
            top: calc(50% + var(--signal-bubble-lift) + 8px);
            clip-path: polygon(100% 50%, 0 0, 0 100%);
        }

        .sbi-signal-login .sbi-signal-panel {
            transform: translateX(14px) scale(0.96);
        }

        .sbi-signal-login.is-revealed .sbi-signal-panel,
        .sbi-signal-login:hover .sbi-signal-panel,
        .sbi-signal-login:focus-visible .sbi-signal-panel {
            transform: translateX(0) scale(1);
        }

        @keyframes loginCornerPulse {
            0% {
                filter: brightness(0.92);
            }

            100% {
                filter: brightness(1.16);
            }
        }

        @keyframes loginSuccessFlash {
            0% {
                box-shadow: inset 0 0 0 rgba(0, 81, 255, 0);
            }

            45% {
                box-shadow: inset 0 0 24px rgba(0, 81, 255, 0.10);
            }

            100% {
                box-shadow: inset 0 0 0 rgba(0, 81, 255, 0);
            }
        }

        @keyframes loginErrorShake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-2px);
            }
        }

        @media (max-width: 768px) {
            .login-page {
                padding-top: 110px;
                align-items: flex-start;
            }

            .login-card {
                padding: 3rem 1.5rem 2.1rem;
            }

            .sbi-signal-login {
                top: auto;
                right: 1rem;
                bottom: 1rem;
            }

            .sbi-signal-login .sbi-signal-panel,
            .sbi-signal-login::after {
                display: none;
            }
        }


        /* =========================================================
           SBI 8.0P.73 - LOGIN MOBILE ALIGNMENT
           ---------------------------------------------------------
           Connexion raccordée au header mobile public, sans scroll
           horizontal, avec assistant repositionné hors du coin lumineux.
           ========================================================= */
        body[data-sbi-public-page="login"] {
            overflow-x: hidden;
            background:
                radial-gradient(circle at 74% 6%, rgba(0, 81, 255, 0.13), transparent 38%),
                radial-gradient(circle at 12% 88%, rgba(0, 132, 255, 0.10), transparent 40%),
                linear-gradient(180deg, #03070e 0%, #050913 100%);
        }

        body[data-sbi-public-page="login"] .sbi-bg-parallax,
        body[data-sbi-public-page="login"] .sbi-line {
            display: none !important;
        }

        body[data-sbi-public-page="login"] .sbi-football-field {
            opacity: 0.085;
        }

        body[data-sbi-public-page="login"] .login-page {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            padding-bottom: 3rem;
        }

        body[data-sbi-public-page="login"] .login-card {
            width: min(450px, calc(100vw - 2rem));
            isolation: isolate;
        }

        @media (max-width: 768px) {
            body[data-sbi-public-page="login"] .login-page {
                min-height: auto;
                padding: calc(78px + 2rem) 1rem 3.4rem;
                align-items: flex-start;
                justify-content: center;
            }

            body[data-sbi-public-page="login"] .login-card {
                width: 100%;
                max-width: 420px;
                margin-inline: auto;
                padding: 2.35rem 1.1rem 2rem;
                overflow: hidden;
            }

            body[data-sbi-public-page="login"] .login-card::before {
                content: none;
                display: none;
            }

            body[data-sbi-public-page="login"] .login-title {
                margin-bottom: 2rem;
                padding-right: 2.35rem;
                font-size: clamp(1.9rem, 10vw, 2.35rem);
                text-align: left;
            }

            body[data-sbi-public-page="login"] .login-field {
                margin-bottom: 1.15rem;
            }

            body[data-sbi-public-page="login"] .login-field-password {
                margin-bottom: 1.85rem;
            }

            body[data-sbi-public-page="login"] .login-submit {
                min-width: 0;
                max-width: 100%;
                padding-left: 0.85rem;
                padding-right: 0.85rem;
                font-size: 0.96rem;
                white-space: normal;
            }

            body[data-sbi-public-page="login"] .login-card-cut {
                width: 52px;
                height: 52px;
                right: 0;
                bottom: 0;
            }

            body[data-sbi-public-page="login"] .sbi-signal-login {
                display: inline-flex;
                position: absolute;
                top: 1rem;
                right: 1rem;
                bottom: auto;
                z-index: 6;
                margin: 0;
                transform: none;
            }

            body[data-sbi-public-page="login"] .sbi-signal-login::before,
            body[data-sbi-public-page="login"] .sbi-signal-login::after,
            body[data-sbi-public-page="login"] .sbi-signal-login .sbi-signal-panel {
                display: none !important;
            }
        }

        @media (max-width: 380px) {
            body[data-sbi-public-page="login"] .login-card {
                padding-left: 0.9rem;
                padding-right: 0.9rem;
            }

            body[data-sbi-public-page="login"] .login-submit {
                font-size: 0.88rem;
            }
        }


        /* =========================================================
           SBI 8.0P.74 - LOGIN MOBILE BACKGROUND STABILIZATION
           ---------------------------------------------------------
           Connexion garde un fond sombre propre et contrôlé. Les
           calques globaux terrain/parallaxe sont coupés sur cette
           page pour éviter les aplats bleus et débordements mobile.
           ========================================================= */
        body[data-sbi-public-page="login"] {
            isolation: isolate;
            overflow-x: clip;
            background: #03070e !important;
        }

        body[data-sbi-public-page="login"]::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 78% 8%, rgba(0, 81, 255, 0.16), transparent 34%),
                radial-gradient(circle at 9% 82%, rgba(0, 132, 255, 0.10), transparent 42%),
                linear-gradient(180deg, #02050b 0%, #06101c 58%, #03070e 100%);
        }

        body[data-sbi-public-page="login"] .sbi-background-root,
        body[data-sbi-public-page="login"] .sbi-bg-fixed,
        body[data-sbi-public-page="login"] .sbi-field-parallax,
        body[data-sbi-public-page="login"] .sbi-bg-parallax,
        body[data-sbi-public-page="login"] .sbi-football-field,
        body[data-sbi-public-page="login"] .sbi-line,
        body[data-sbi-public-page="login"] .sbi-particle,
        body[data-sbi-public-page="login"] .sbi-fog {
            display: none !important;
        }

        body[data-sbi-public-page="login"] .login-page {
            background: transparent !important;
        }

        @media (max-width: 768px) {
            body[data-sbi-public-page="login"] .login-page {
                min-height: calc(100dvh - var(--header-height));
                padding-top: calc(var(--header-height) + 1.55rem);
                padding-bottom: 4rem;
            }

            body[data-sbi-public-page="login"] .login-card {
                background:
                    linear-gradient(180deg, rgba(7, 12, 23, 0.97), rgba(3, 7, 14, 0.985)),
                    radial-gradient(circle at 90% 3%, rgba(0, 81, 255, 0.11), transparent 32%);
            }
        }


        /* =========================================================
           SBI 8.0P.86 - LOGIN DESKTOP ANIMATED BACKGROUND RESTORE
           ---------------------------------------------------------
           Restaure le fond animé global sur desktop, tout en gardant
           la stabilisation mobile validée.
           ========================================================= */
        @media (min-width: 769px) {
            body[data-sbi-public-page="login"] {
                background: var(--bg-dark) !important;
            }

            body[data-sbi-public-page="login"] .sbi-background-root,
            body[data-sbi-public-page="login"] .sbi-bg-fixed,
            body[data-sbi-public-page="login"] .sbi-field-parallax,
            body[data-sbi-public-page="login"] .sbi-bg-parallax,
            body[data-sbi-public-page="login"] .sbi-football-field,
            body[data-sbi-public-page="login"] .sbi-line,
            body[data-sbi-public-page="login"] .sbi-particle,
            body[data-sbi-public-page="login"] .sbi-fog {
                display: block !important;
            }

            body[data-sbi-public-page="login"] .login-page {
                position: relative;
                z-index: 2;
            }
        }


        /* =========================================================
           SBI 8.0P.154 - PUBLIC PASSWORD RESET REQUEST
           ---------------------------------------------------------
           Panneau discret de demande de lien reset, envoyé via
           Cloud Function + template Brevo SBI.
           ========================================================= */
        .login-forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -1.95rem;
            margin-bottom: 1.75rem;
            position: relative;
            z-index: 2;
        }

        .login-forgot-link {
            appearance: none;
            border: 0;
            background: transparent;
            padding: 0;
            color: var(--text-muted);
            font: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.22s ease, opacity 0.22s ease;
        }

        .login-forgot-link:hover,
        .login-forgot-link:focus-visible {
            color: var(--sbi-blue);
            outline: none;
        }

        .login-reset-panel {
            margin-top: 1.1rem;
            padding: 1rem;
            border: 1px solid rgba(0, 81, 255, 0.22);
            border-radius: 8px;
            background: linear-gradient(145deg, rgba(0, 81, 255, 0.09), rgba(255, 255, 255, 0.025));
            position: relative;
            z-index: 2;
        }

        .login-reset-panel[hidden] {
            display: none !important;
        }

        .login-reset-panel-title {
            margin: 0 0 0.45rem;
            color: #fff;
            font-size: 0.96rem;
            font-weight: 900;
        }

        .login-reset-panel-text,
        .login-reset-status {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.55;
        }

        .login-reset-form {
            margin-top: 0.85rem;
        }

        .login-reset-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            margin-top: 0.8rem;
        }

        .login-reset-submit {
            flex: 1;
            justify-content: center;
            min-height: 42px;
            padding: 0.72rem 0.9rem;
            font-size: 0.82rem;
        }

        .login-reset-cancel {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.035);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 0.66rem 0.85rem;
            transition: border-color 0.22s ease, color 0.22s ease, background 0.22s ease;
        }

        .login-reset-cancel:hover,
        .login-reset-cancel:focus-visible {
            border-color: rgba(0, 81, 255, 0.45);
            color: #fff;
            background: rgba(0, 81, 255, 0.08);
            outline: none;
        }

        .login-reset-status {
            min-height: 1.15rem;
            margin-top: 0.75rem;
            font-weight: 700;
        }

        .login-reset-status.is-success {
            color: #78ffb5;
        }

        .login-reset-status.is-error {
            color: #ff7b7b;
        }

        @media (max-width: 768px) {
            .login-forgot-row {
                margin-top: -1.25rem;
                margin-bottom: 1.35rem;
            }

            .login-reset-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }

    </style>
</head>

<body data-sbi-public-page="login">

    <header class="site-header">
        <div class="logo-container">
            <a href="index.html" class="header-logo-link">
                <img src="assets/Logo_SBI_Tome.webp" alt="SBI Logo" class="header-logo" data-site-media="header-logo">
                <img src="assets/sbi_brand.webp" alt="Sport Business Institute" class="header-brand" data-site-media="brand-logo">
            </a>
        </div>

        <nav class="main-nav">
            <a href="formations.html" class="nav-link text-italic">Formations</a>
            <a href="calculateur.html" class="nav-link text-italic">Calculateur</a>
            <a href="a-propos.html" class="nav-link text-italic">À propos</a>
            <a href="ressources.html" class="nav-link text-italic">Ressources</a>
        </nav>

        <div class="header-actions">
            <a href="login.html" class="nav-link text-italic">Se connecter</a>
            <a href="contact.html" class="btn-primary text-italic">Contact</a>
        </div>

        <button class="mobile-menu-toggle" type="button" aria-label="Ouvrir le menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main id="public-main" class="login-page" data-sbi-public-shell-root>
        <div class="login-card fade-in" id="login-card">

            <div class="card-badge"></div>
            <div class="login-card-cut"></div>

            <a href="contact.html" class="sbi-signal sbi-signal-login" aria-label="Nous contacter pour rejoindre SBI">
                <span class="sbi-signal-dot" aria-hidden="true"></span>
                <span class="sbi-signal-panel text-italic">
                    <span class="sbi-signal-label">Pour nous rejoindre, contactez-nous</span>
                </span>
            </a>

            <h1 class="login-title uppercase text-italic">
                C<span class="text-blue">o</span>nnexion
            </h1>

            <form id="login-form">
                <div class="login-field">
                    <label for="email" class="text-italic">Adresse Email</label>
                    <input type="email" id="email" class="login-input text-italic" required autocomplete="email">
                </div>

                <div class="login-field login-field-password">
                    <label for="password" class="text-italic">Mot de passe</label>
                    <input type="password" id="password" class="login-input text-italic" required autocomplete="current-password">
                </div>

                <div class="login-forgot-row">
                    <button type="button" class="login-forgot-link text-italic" id="login-forgot-password">
                        Mot de passe oublié ?
                    </button>
                </div>

                <button type="submit" class="btn-primary text-italic login-submit" id="login-submit">
                    <span class="login-submit-label">Accéder à l'espace</span>
                    <span class="login-submit-arrow">→</span>
                </button>
            </form>

            <section class="login-reset-panel" id="login-reset-panel" hidden aria-labelledby="login-reset-title">
                <h2 class="login-reset-panel-title text-italic" id="login-reset-title">Réinitialiser le mot de passe</h2>
                <p class="login-reset-panel-text text-italic">Indique l’adresse email liée au compte SBI. Un lien sécurisé sera envoyé si le compte existe.</p>
                <form class="login-reset-form" id="login-reset-form">
                    <label for="reset-email" class="text-italic">Adresse email du compte</label>
                    <input type="email" id="reset-email" class="login-input text-italic" required autocomplete="email">
                    <div class="login-reset-actions">
                        <button type="submit" class="btn-primary text-italic login-reset-submit" id="login-reset-submit">Recevoir le lien</button>
                        <button type="button" class="login-reset-cancel text-italic" id="login-reset-cancel">Annuler</button>
                    </div>
                    <p class="login-reset-status text-italic" id="login-reset-status" aria-live="polite"></p>
                </form>
            </section>

            <div id="error-message" class="text-italic" aria-live="polite"></div>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Eleve - Lives</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/student/css/student.css">
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.216">
  <script src="/admin/js/components.js?v=8.0P.167.216"></script>
</head>
<body class="preload sbi-live-page">
  <div class="app-container" id="app-container">
    <student-left-panel></student-left-panel>
    <student-top-bar></student-top-bar>

    <main id="main-content">
      <div class="content-wrapper">
        <section class="sbi-live-hero">
          <div>
            <span class="sbi-live-kicker">Eleve</span>
            <h1>Mes lives</h1>
          </div>
          <span id="student-live-status" class="sbi-live-status"></span>
        </section>

        <div class="sbi-live-hero" style="align-items:center;">
          <div class="sbi-live-tabs">
            <button type="button" class="is-active" data-student-live-tab="upcoming">A venir</button>
            <button type="button" data-student-live-tab="replay">Replay</button>
          </div>
          <div class="sbi-live-view-toggle">
            <button type="button" class="is-active" data-student-live-view="list">Liste</button>
            <button type="button" data-student-live-view="calendar">Calendrier</button>
          </div>
        </div>

        <section id="student-live-content"></section>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/admin-ui.js?v=8.0P.167.216"></script>
  <script type="module" src="/admin/js/admin-notifications.js?v=8.0P.167.216"></script>
  <script type="module" src="/student/js/student-lives.js?v=8.0P.167.216"></script>

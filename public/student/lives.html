<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Eleve - Lives</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/student/css/student.css">
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.226">
  <script src="/admin/js/components.js?v=8.0P.167.226"></script>
  <style>
    html, body, body.sbi-live-page, #app-container, #main-content, .content-wrapper {
      opacity: 1 !important;
      visibility: visible !important;
    }
    body.sbi-live-page {
      min-height: 100vh !important;
      background: #f4f7f6 !important;
    }
    #app-container, #main-content {
      display: block;
    }
  </style>
  <script>
    (function () {
      function revealStudentLives() {
        document.documentElement.classList.remove('preload');
        if (document.body) {
          document.body.classList.remove('preload');
          document.body.style.opacity = '1';
          document.body.style.visibility = 'visible';
        }
        var app = document.getElementById('app-container');
        var main = document.getElementById('main-content');
        var content = document.querySelector('.content-wrapper');
        [app, main, content].forEach(function (node) {
          if (!node) return;
          node.hidden = false;
          node.style.opacity = '1';
          node.style.visibility = 'visible';
        });
      }
      revealStudentLives();
      document.addEventListener('DOMContentLoaded', revealStudentLives, { once: true });
      window.addEventListener('pageshow', revealStudentLives);
      setTimeout(revealStudentLives, 80);
      setTimeout(revealStudentLives, 300);
      setTimeout(revealStudentLives, 1000);
    }());
  </script>
</head>
<body class="preload sbi-live-page" data-sbi-standalone="student-lives">
  <div class="app-container" id="app-container">
    <student-left-panel></student-left-panel>
    <student-top-bar></student-top-bar>

    <main id="main-content">
      <div class="content-wrapper">
        <section class="sbi-live-hero">
          <div>
            <span class="sbi-live-kicker">Eleve</span>
            <h1>Mes lives</h1>
          </div>
          <span id="student-live-status" class="sbi-live-status"></span>
        </section>

        <div class="sbi-live-hero" style="align-items:center;">
          <div class="sbi-live-tabs">
            <button type="button" class="is-active" data-student-live-tab="upcoming">A venir</button>
            <button type="button" data-student-live-tab="replay">Replay</button>
          </div>
          <div class="sbi-live-view-toggle">
            <button type="button" class="is-active" data-student-live-view="list">Liste</button>
            <button type="button" data-student-live-view="calendar">Calendrier</button>
          </div>
        </div>

        <section id="student-live-content"><div class="sbi-live-empty">Chargement des lives...</div></section>
      </div>
    </main>
  </div>

  <script>
    window.setTimeout(function () {
      var root = document.getElementById('student-live-content');
      if (!root) return;
      var text = (root.textContent || '').trim();
      if (!window.__SBI_STUDENT_LIVES_RENDERED && (!text || text === 'Chargement des lives...')) {
        root.innerHTML = '<div class="sbi-live-empty">Chargement encore en cours... Si rien ne s’affiche, rechargez avec Ctrl+F5.</div>';
      }
    }, 5000);
  </script>

  <script>
    (function () {
      if (window.__SBI_STUDENT_LIVES_INLINE_NAV === true) return;
      window.__SBI_STUDENT_LIVES_INLINE_NAV = true;
      function go(href) { if (href) window.location.assign(new URL(href, window.location.origin).href); }
      document.addEventListener('click', function (event) {
        var panelToggle = event.target.closest && event.target.closest('#btn-toggle-panel');
        if (panelToggle) {
          var app = document.getElementById('app-container');
          if (app) app.classList.toggle('left-collapsed');
          return;
        }
        var mobileToggle = event.target.closest && event.target.closest('#btn-toggle-mobile');
        if (mobileToggle) {
          var appMobile = document.getElementById('app-container');
          if (appMobile) appMobile.classList.toggle('left-open');
          return;
        }
        var trigger = event.target.closest && event.target.closest('[data-sbi-href]');
        if (!trigger) return;
        var href = trigger.dataset.sbiHref || trigger.getAttribute('href') || '';
        if (!href) return;
        event.preventDefault();
        go(href);
      }, true);
    }());
  </script>
  <script type="module" src="/admin/js/admin-ui.js?v=8.0P.167.226"></script>
  <script type="module" src="/student/js/student-lives.js?v=8.0P.167.226"></script>
</body>
</html>

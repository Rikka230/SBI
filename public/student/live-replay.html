<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Élève - Replay live</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/student/css/student.css">
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.221">
  <style>
    html, body, body.sbi-live-replay-page, .sbi-live-standalone-shell, .sbi-live-standalone-content {
      opacity: 1 !important;
      visibility: visible !important;
    }
    body.sbi-live-replay-page {
      display: block !important;
      min-height: 100vh !important;
      background: #f4f7f6 !important;
    }
    .sbi-live-standalone-shell {
      min-height: 100vh !important;
      display: block !important;
      padding: clamp(1rem, 3vw, 2.2rem) !important;
      box-sizing: border-box;
    }
    .sbi-live-standalone-content {
      display: block !important;
      width: min(100%, 1280px) !important;
      margin: 0 auto !important;
    }
    .sbi-live-replay-placeholder[hidden] { display: none !important; }
  </style>
  <script>
    (function () {
      function captureLiveId() {
        try {
          var url = new URL(window.location.href);
          var id = url.searchParams.get('liveId') || url.searchParams.get('id');
          if (!id && url.hash) {
            var params = new URLSearchParams(String(url.hash || '').replace(/^#/, ''));
            id = params.get('liveId') || params.get('id');
          }
          if (!id) {
            var match = url.pathname.match(/\/student\/live-replay\/([^/?#]+)/);
            if (match) id = decodeURIComponent(match[1]);
          }
          if (id) {
            sessionStorage.setItem('sbi:lastReplayLiveId', id);
            localStorage.setItem('sbi:lastReplayLiveId', id);
            document.body && (document.body.dataset.liveId = id);
          }
        } catch (_) {}
      }
      function revealReplayPage() {
        captureLiveId();
        document.documentElement.classList.remove('preload');
        if (document.body) {
          document.body.classList.remove('preload');
          document.body.style.opacity = '1';
          document.body.style.visibility = 'visible';
        }
        var shell = document.querySelector('.sbi-live-standalone-shell');
        var content = document.querySelector('.sbi-live-standalone-content');
        if (shell) { shell.hidden = false; shell.style.display = 'block'; shell.style.visibility = 'visible'; shell.style.opacity = '1'; }
        if (content) { content.hidden = false; content.style.display = 'block'; content.style.visibility = 'visible'; content.style.opacity = '1'; }
      }
      revealReplayPage();
      document.addEventListener('DOMContentLoaded', revealReplayPage, { once: true });
      window.addEventListener('pageshow', revealReplayPage);
      setTimeout(revealReplayPage, 80);
      setTimeout(revealReplayPage, 300);
      setTimeout(revealReplayPage, 1000);
    }());
  </script>
</head>
<body class="sbi-live-page sbi-live-replay-page" data-sbi-standalone="live-replay">
  <main class="sbi-live-standalone-shell">
    <div class="sbi-live-standalone-content">
      <section class="sbi-live-hero">
        <div>
          <span class="sbi-live-kicker">Replay</span>
          <h1 id="sbi-replay-title">Replay live</h1>
        </div>
        <a id="sbi-live-replay-back" class="sbi-live-btn sbi-live-btn--ghost" href="/student/lives.html?tab=replay" data-sbi-hard-return="true">Retour aux lives</a>
      </section>

      <section class="sbi-live-replay-shell">
        <div class="sbi-live-replay-player-wrap" id="sbi-live-replay-player-wrap">
          <video id="sbi-live-replay-video" class="sbi-live-replay-video" controls playsinline preload="metadata" hidden></video>
          <div id="sbi-live-replay-watermark" class="sbi-live-replay-watermark" aria-hidden="true">SBI</div>
          <div id="sbi-live-replay-placeholder" class="sbi-live-replay-placeholder">Préparation du replay...</div>
        </div>
        <div class="sbi-live-replay-side">
          <strong>Lecture en ligne</strong>
          <p id="sbi-live-replay-status">Recherche du replay Daily...</p>
          <button id="sbi-live-replay-fullscreen" class="sbi-live-btn sbi-live-btn--ghost" type="button" hidden>Plein écran</button>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/student/js/live-replay.js?v=8.0P.167.221"></script>
</body>
</html>

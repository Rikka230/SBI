<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Élève - Replay live</title>
  <link rel="stylesheet" href="/admin/css/admin-layout.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/student/css/student.css">
  <link rel="stylesheet" href="/css/live-platform.css?v=8.0P.167.215">
  <script src="/admin/js/components.js?v=8.0P.167.215"></script>
</head>
<body class="preload sbi-live-page sbi-live-replay-page">
  <div class="app-container" id="app-container">
    <student-left-panel></student-left-panel>
    <student-top-bar></student-top-bar>

    <main id="main-content">
      <div class="content-wrapper">
        <section class="sbi-live-hero">
          <div>
            <span class="sbi-live-kicker">Replay</span>
            <h1 id="sbi-replay-title">Replay live</h1>
          </div>
          <a class="sbi-live-btn sbi-live-btn--ghost" href="/student/lives.html">Retour aux lives</a>
        </section>

        <section class="sbi-live-replay-shell">
          <div class="sbi-live-replay-player-wrap">
            <video id="sbi-live-replay-video" class="sbi-live-replay-video" controls playsinline preload="metadata" hidden></video>
            <div id="sbi-live-replay-placeholder" class="sbi-live-replay-placeholder">Préparation du replay...</div>
          </div>
          <div class="sbi-live-replay-side">
            <strong>Lecture en ligne</strong>
            <p id="sbi-live-replay-status">Recherche du replay Daily...</p>
            <a id="sbi-live-replay-download" class="sbi-live-btn sbi-live-btn--ghost" href="#" target="_blank" rel="noopener noreferrer" hidden>Ouvrir / télécharger</a>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/admin-ui.js?v=8.0P.167.215"></script>
  <script type="module" src="/admin/js/admin-notifications.js?v=8.0P.167.215"></script>
  <script type="module" src="/student/js/live-replay.js?v=8.0P.167.215"></script>
</body>
</html>
